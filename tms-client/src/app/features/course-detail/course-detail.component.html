<div class="max-w-3xl mx-auto my-8 p-6 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl text-slate-100 backdrop-blur space-y-6">

  <!-- Header & Back Navigation -->
  <div class="flex items-center justify-between border-b border-slate-800 pb-4">
    <h1 class="text-2xl font-bold text-white tracking-tight">
      Course Detail
    </h1>
    
    <a 
      routerLink="/dashboard" 
      class="inline-flex items-center text-xs font-semibold text-cyan-400 hover:text-cyan-300 transition">
      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to Dashboard
    </a>
  </div>

  <!-- Course Metadata Card -->
  <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-5 flex items-center justify-between">
    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">
      Course Identifier
    </span>
    <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-mono font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">
      ID: {{ id() }}
    </span>
  </div>
